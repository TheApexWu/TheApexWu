name: Metrics
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          user: TheApexWu
          template: classic
          config_timezone: America/New_York

          base: ""
          base_header: no
          base_activity: no
          base_community: no
          base_repositories: no
          base_metadata: no
          base_hireable: no
          repositories_skipped: TheApexWu

          plugin_languages: yes
          plugin_languages_categories: programming
          plugin_languages_colors: github
          plugin_languages_ignored: Jupyter Notebook, HTML, CSS, Shell, Makefile
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 1%
          plugin_languages_details: percentage
          # indepth mode (clone + github-linguist per repo) times out on the runner
          # and renders partial garbage. Standard mode uses GitHub's precomputed
          # per-repo stats: fast, no timeout, accurate. See git history for the regression.
          plugin_languages_indepth: no

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          config_order: isocalendar, languages
