name: Metrics
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          user: TheApexWu
          template: classic
          config_timezone: America/New_York

          base: ""
          repositories_skipped: TheApexWu

          plugin_languages: yes
          plugin_languages_categories: programming
          plugin_languages_colors: github
          plugin_languages_ignored: Jupyter Notebook, HTML, CSS, Shell, Makefile
          # Languages = my own public code only. Private repos (mostly Python
          # research/scrapers) were inflating Python to ~66% and burying Go/Rust.
          # Skipping them + forks yields the real public distribution (Python/TS/JS/Go).
          plugin_languages_skipped: negotiated-taste, majikari-scraper, contraband-wu-intel, majikari-web, amadeuswoo, East2West, sixth-borough-draft, contraband-wu-map, niwa-draft, war-council, lacuna-prep, monad, suzerain, nextjs-boilerplate, deepmeridian, nickAlex, ag2, spotify-pinyin-lyrics
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 1%
          plugin_languages_details: percentage
          # indepth mode (clone + github-linguist per repo) times out on the runner
          # and renders partial garbage. Standard mode uses GitHub's precomputed
          # per-repo stats: fast, no timeout, accurate. See git history for the regression.
          plugin_languages_indepth: no

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          config_order: isocalendar, languages
